<VirtualHost *:80>
    ServerName dreamint.codex-pi.local
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/dreamint-error.log
    CustomLog ${APACHE_LOG_DIR}/dreamint-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName dreamint.codex-pi.local
    ServerAdmin webmaster@localhost

    SSLEngine On
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/dreamint-error-ssl.log
    CustomLog ${APACHE_LOG_DIR}/dreamint-access-ssl.log combined
</VirtualHost>
